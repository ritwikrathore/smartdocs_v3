[project]
name = "smartdocs"
version = "0.1.0"
description = "Smart document analysis tool"
requires-python = ">=3.12"
dependencies = [
    "numpy==2.2.5",
    "openai>=1.99.9",
    "pandas==2.2.3",
    "pdfplumber==0.11.6",
    "psutil==7.0.0",
    "python-dotenv==1.1.0",
    "python-docx==1.1.2",
    "pymupdf==1.26.1",
    "rank-bm25==0.2.2",
    "requests>=2.32.2",
    "setuptools==78.1.0",
    "spacy==3.8.5",
    "streamlit==1.49.0",
    "streamlit-pdf-viewer==0.0.27",
    "thefuzz==0.22.1",
    "openpyxl==3.1.5",
    "transformers==4.50.3",
    "pydantic-ai==1.0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = []
